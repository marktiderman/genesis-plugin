name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Let the review RUN the suite rather than only read it.
          #
          # Reviews limited to reading repeatedly cleared changes that a review able to execute then
          # found broken — including a `--check` that validated everything except the one property
          # its own pull request existed to guarantee. Reading confirms a change is self-consistent.
          # Only running confirms the check fails when the promise breaks.
          #
          # Deliberately narrow, because this triggers on `pull_request` and the code under review
          # is untrusted: a blanket `Bash` grant would let any pull request run anything with this
          # job's token. `node --test` needs no install and no network here — the suite is Node
          # built-ins only — so the whole capability is one command over files already checked out.
          claude_args: '--allowedTools "Bash(node --test:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

